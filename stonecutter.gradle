plugins {
	id 'dev.kikugie.stonecutter'
}

// The version src/ is currently written for (what the IDE sees). Switch with the "Set active project to <version>"
// tasks; commit with it back on 26.3.
stonecutter.active '26.3'

// Class renames that only differ by name; real differences use //? conditionals (docs/porting.md).
stonecutter.parameters {
	// The loader this node builds for, for //? if neoforge (the NeoForge nodes are named <version>-neoforge, the Forge one
	// <version>-forge).
	constants.match(current.project.endsWith('-neoforge') ? 'neoforge' : current.project.endsWith('-forge') ? 'forge' : 'fabric', 'fabric', 'neoforge', 'forge')
	// The tests' harness (src/gametest/.../harness) hooks the GPU layer, which 26.3 moved from com.mojang.blaze3d to
	// com.mojang.renderpearl, and the keyboard, whose keys went from GLFW key codes to SDL scancodes.
	replacements.string(current.parsed.matches('<26.3')) {
		replace 'com.mojang.renderpearl.api.textures.', 'com.mojang.blaze3d.textures.'
		replace 'com.mojang.renderpearl.backend.opengl.', 'com.mojang.blaze3d.opengl.'
		replace 'com/mojang/renderpearl/backend/opengl/', 'com/mojang/blaze3d/opengl/'
		replace 'com.mojang.renderpearl.backend.vulkan.', 'com.mojang.blaze3d.vulkan.'
		replace 'com.mojang.renderpearl.api.device.GpuBackend', 'com.mojang.blaze3d.systems.GpuBackend'
		replace 'com/mojang/renderpearl/api/device/GpuBackend', 'com/mojang/blaze3d/systems/GpuBackend'
		replace 'InputConstants.Type.KEYBOARD', 'InputConstants.Type.KEYSYM'
	}
	replacements.string(current.parsed.matches('>=1.21.9 <26.3')) {
		replace 'InputConstants.KEY_LGUI', 'InputConstants.KEY_LSUPER'
	}
	// 26.2 moved the open screen into Gui (minecraft.gui.screen()); before, Minecraft held it.
	replacements.regex(current.parsed.matches('<26.2')) {
		replace '\\.gui\\.screen\\(\\)', '.screen', '(?!)', 'unused'
		replace '\\.gui\\.setScreen\\(', '.setScreen(', '(?!)', 'unused'
		replace '\\bgameRenderer\\.mainRenderTarget\\(\\)', 'getMainRenderTarget()', '(?!)', 'unused'
		replace '(?<=gameRenderer\\.)mainCamera\\(\\)', 'getMainCamera()', '(?!)', 'unused'
		// (The HUD was Gui itself; hiding it is Versions.toggleHud in the tests.)
		replace '\\.gui\\.hud\\b', '.gui', '(?!)', 'unused'
	}
	// 1.21.9 renamed the Windows key (the left GUI key on 26.3) to super.
	replacements.regex(current.parsed.matches('<1.21.9')) {
		replace 'InputConstants\\.KEY_LGUI\\b', 'InputConstants.KEY_LWIN', '(?!)', 'unused'
		// (And the window's handle was getWindow().)
		replace 'getWindow\\(\\)\\.handle\\(\\)', 'getWindow().getWindow()', '(?!)', 'unused'
	}
	// 26.1 renamed a few members the tests use.
	replacements.regex(current.parsed.matches('<26.1')) {
		replace '\\.entityTags\\(\\)', '.getTags()', '(?!)', 'unused'
		replace '\\.resizeGui\\(\\)', '.resizeDisplay()', '(?!)', 'unused'
		replace '\\bChunkPos\\.pack\\(', 'ChunkPos.asLong(', '(?!)', 'unused'
	}
	// 26.2 split the HUD out of Gui (the HUD class was Gui) and dropped "Renderer" from the contextual bars.
	replacements.regex(current.parsed.matches('<26.2')) {
		// (No way back: 26.2 kept the name Gui for the class around the HUD, so src/ names it too; docs/porting.md.)
		replace '\\bHud\\b', 'Gui', '(?!)', 'Hud'
		replace '\\bContextualBar\\b', 'ContextualBarRenderer', '\\bContextualBarRenderer\\b', 'ContextualBar'
		replace '\\bJumpableVehicleBar\\b', 'JumpableVehicleBarRenderer', '\\bJumpableVehicleBarRenderer\\b', 'JumpableVehicleBar'
	}
	// Fabric API renamed the payload registries for 26.1.
	replacements.string(current.parsed.matches('<26.1')) {
		replace 'PayloadTypeRegistry.clientboundPlay()', 'PayloadTypeRegistry.playS2C()'
		replace 'PayloadTypeRegistry.serverboundPlay()', 'PayloadTypeRegistry.playC2S()'
	}
	// Fabric API renamed some client classes for 26.1.
	replacements.string(current.parsed.matches('<26.1')) {
		replace 'client.keymapping.v1.KeyMappingHelper', 'client.keybinding.v1.KeyBindingHelper'
		replace 'KeyMappingHelper', 'KeyBindingHelper'
		replace 'registerKeyMapping(', 'registerKeyBinding('
		replace 'LivingEntityRenderLayerRegistrationCallback', 'LivingEntityFeatureRendererRegistrationCallback'
		replace 'ModelLayerRegistry', 'EntityModelLayerRegistry'
	}
	// 26.1 renamed the GUI drawing class and its render methods ("extract" because drawing now builds a render state).
	replacements.string(current.parsed.matches('<26.1')) {
		replace 'GuiGraphicsExtractor', 'GuiGraphics'
		replace 'extractWidgetRenderState', 'renderWidget'
		replace 'extractBackground', 'renderBackground'
	}
	replacements.string(current.parsed.matches('<26.1')) {
		replace 'renderer.state.level.CameraRenderState', 'renderer.state.CameraRenderState'
		replace 'renderer/state/level/CameraRenderState', 'renderer/state/CameraRenderState'
	}
	// 1.21.11 renamed the camera's position and look vector getters.
	replacements.regex(current.parsed.matches('<1.21.11')) {
		replace '(?<=ainCamera\\(\\))\\.position\\(\\)', '.getPosition()', '(?!)', 'unused'
	}
	// 1.21.11 moved Util into net.minecraft.util.
	replacements.regex(current.parsed.matches('<1.21.11')) {
		replace 'net\\.minecraft\\.util\\.Util\\b', 'net.minecraft.Util', '(?!)', 'unused'
		replace 'net/minecraft/util/Util;', 'net/minecraft/Util;', '(?!)', 'unused'
	}
	// 1.21.11 renamed ResourceLocation to Identifier, moved the horses into an "equine" package and the chicken into its
	// own, and started annotating with JSpecify.
	replacements.regex(current.parsed.matches('<1.21.11')) {
		replace '\\bIdentifier\\b', 'ResourceLocation', '\\bResourceLocation\\b', 'Identifier'
	}
	replacements.string(current.parsed.matches('<1.21.11')) {
		replace 'client.model.animal.equine.AbstractEquineModel', 'client.model.AbstractEquineModel'
		replace 'client.model.player.PlayerModel', 'client.model.PlayerModel'
		replace 'client.renderer.rendertype.RenderTypes', 'client.renderer.RenderType'
		replace 'RenderTypes.entityCutout(', 'RenderType.entityCutout('
		replace 'animal.equine.', 'animal.horse.'
		replace 'animal.chicken.Chicken', 'animal.Chicken'
		replace 'org.jspecify.annotations.Nullable', 'org.jetbrains.annotations.Nullable'
	}
	// 1.21.9 made the player an "avatar" (and gave the player renderer a generic). One way only: the way back must never
	// match (26.3 has a PlayerRenderState of its own, and other 26.x code names AbstractClientPlayer).
	replacements.regex(current.parsed.matches('<1.21.9')) {
		replace '\\bAvatarRenderState\\b', 'PlayerRenderState', '(?!)', 'unused'
		replace '\\bAvatarRenderer\\b', 'PlayerRenderer', '(?!)', 'unused'
		replace 'AvatarRenderer<\\?>', 'PlayerRenderer', '(?!)', 'unused'
		replace 'net\\.minecraft\\.world\\.entity\\.Avatar;', 'net.minecraft.client.player.AbstractClientPlayer;', '(?!)', 'unused'
		replace 'net/minecraft/world/entity/Avatar;', 'net/minecraft/client/player/AbstractClientPlayer;', '(?!)', 'unused'
		replace 'final Avatar entity', 'final AbstractClientPlayer entity', '(?!)', 'unused'
		replace '\\(\\(Model<\\?>\\) \\(Object\\) this\\)', '((Model) (Object) this)', '(?!)', 'unused'
	}
	// 1.21.2 moved the particle setting's values to the server package, added the ARGB colour helpers (FastColor's before), and
	// renamed the level's lowest height and an image's pixel read (the same ABGR pixels).
	replacements.regex(current.parsed.matches('<1.21.2')) {
		replace 'net\\.minecraft\\.server\\.level\\.ParticleStatus\\b', 'net.minecraft.client.ParticleStatus', '(?!)', 'unused'
		replace 'import net\\.minecraft\\.util\\.ARGB;', 'import net.minecraft.util.FastColor;', '(?!)', 'unused'
		replace '\\bARGB\\.(red|green|blue|alpha)\\(', 'FastColor.ARGB32.$1(', '(?!)', 'unused'
		replace '\\.getMinY\\(\\)', '.getMinBuildHeight()', '(?!)', 'unused'
		replace '\\bgetPixelsABGR\\b', 'getPixelsRGBA', '(?!)', 'unused'
	}
	// 1.20.3 renamed grass to short grass.
	replacements.regex(current.parsed.matches('<1.20.3')) {
		replace '\\bBlocks\\.SHORT_GRASS\\b', 'Blocks.GRASS', '(?!)', 'unused'
	}
	// 1.20.5 moved chunk status into its own package and renamed the plain message screen.
	replacements.regex(current.parsed.matches('<1.20.5')) {
		replace 'world\\.level\\.chunk\\.status\\.ChunkStatus\\b', 'world.level.chunk.ChunkStatus', '(?!)', 'unused'
		replace '\\bGenericMessageScreen\\b', 'GenericDirtMessageScreen', '(?!)', 'unused'
	}
	// Before 1.21.2 there are no entity render states: the mod's own stand-ins (client/render/state/) take their place, filled
	// from the entity by the renderer mixin. One way only, like the Avatar ones.
	replacements.regex(current.parsed.matches('<1.21.2')) {
		replace 'net\\.minecraft\\.client\\.renderer\\.entity\\.state\\.', 'dev.horsingaround.client.render.state.', '(?!)', 'unused'
		replace '\\bItemUseAnimation\\b', 'UseAnim', '(?!)', 'unused'
		// (A model part's pose was a class with fields, not a record.)
		replace '\\b(initial|pose|getInitialPose\\(\\))\\.(x|y|z|xRot|yRot|zRot)\\(\\)', '$1.$2', '(?!)', 'unused'
		replace 'net\\.minecraft\\.world\\.entity\\.player\\.Input;', 'dev.horsingaround.ride.Input;', '(?!)', 'unused'
	}
	// The game's clock lived under another name in 1.21.1, and before 1.21 had no delta tracker (the partial tick of the game
	// clock is the frame's, then).
	replacements.string(current.parsed.matches('>=1.21 <1.21.2')) {
		replace 'getDeltaTracker()', 'getTimer()'
	}
	replacements.regex(current.parsed.matches('<1.21')) {
		replace 'getDeltaTracker\\(\\)\\.getGameTimeDeltaPartialTick\\(true\\)', 'getFrameTime()', '(?!)', 'unused'
	}
	// Before 1.21 a resource location was made with a constructor, and the options screens were not in a package of their own.
	replacements.regex(current.parsed.matches('<1.21')) {
		replace 'gui\\.screens\\.options\\.OptionsSubScreen', 'gui.screens.OptionsSubScreen', '(?!)', 'unused'
		replace '\\b(Identifier|ResourceLocation)\\.(fromNamespaceAndPath|withDefaultNamespace)\\(', 'new ResourceLocation(', '(?!)', 'unused'
	}
	// Before 1.20.5 an entity renderer's rotation set-up had no scale argument (the game's own scale entity attribute came with 1.20.5).
	replacements.regex(current.parsed.matches('<1.20.5')) {
		replace 'PoseStack;FFFF\\)V', 'PoseStack;FFF)V', '(?!)', 'unused'
	}
	// 1.20.2 added the collision test that looks at blocks only (Vanilla has it for the versions before).
	replacements.regex(current.parsed.matches('<1.20.2')) {
		replace '\\blevel\\.noBlockCollision\\(', 'Vanilla.noBlockCollision(level, ', '(?!)', 'unused'
	}
	// The camera started keeping the frame's partial tick in 1.20.3 (nothing reads it before).
	replacements.regex(current.parsed.matches('<1.20.3')) {
		replace 'this\\.partialTickTime = partialTicks;', '// (the camera keeps no partial tick yet)', '(?!)', 'unused'
	}
	// 1.20.3 gave lists a position and a height; before, they had a top and a bottom and a width of their own.
	replacements.regex(current.parsed.matches('<1.20.3')) {
		replace 'super\\(minecraft, width, height - 64, 32, 25\\)', 'super(minecraft, width, height, 32, height - 32, 25)', '(?!)', 'unused'
	}
	// 1.21.5 reworked who simulates a controlled entity; for a horse a player rides or nobody rides it comes to the same
	// answer as the older name.
	replacements.string(current.parsed.matches('<1.21.5')) {
		replace 'isLocalInstanceAuthoritative', 'isControlledByLocalInstance'
	}
	// 1.21.5 renamed placing an entity, and the hotbar's selected slot became private.
	replacements.regex(current.parsed.matches('<1.21.5')) {
		replace '\\.snapTo\\(', '.moveTo(', '(?!)', 'unused'
		replace '\\.getSelectedSlot\\(\\)', '.selected', '(?!)', 'unused'
	}
}
