// In-game smoke test (src/smoke), built for every Minecraft version: ./gradlew :<version>:runSmoke runs one version,
// plain ./gradlew runSmoke runs every version, one game at a time. A client creates a flat world, builds a small scene
// (a saddled horse, leashed mobs), rides through every gait and a jump, and takes screenshots from the side and as the
// rider; the task fails unless the log says "Horsing Around smoke test passed", nothing in it names this mod in an
// error, and the server never corrected the rider's moves (rubber-banding). Everything lands in build/run/smoke/<version>/
// (screenshots in its screenshots/ folder).
//
// -PsmokeNoPack: same run without the Fresh Animations pack turned on.
// -PsmokeWithoutMod: the same run with this mod turned off (Fabric Loader's fabric.debug.disableModIds), to tell
//   whether something is this mod's doing; the ride checks that need the mod are skipped, and server corrections are
//   only reported (they are vanilla's own then, which is what the comparison is for).
// -PsmokePlain: no Entity Model Features, Entity Texture Features or Fresh Animations at all (build.gradle leaves the
//   two mods off the runtime classpath), to tell this mod's problems from the animation stack's.
//
// Test code only: the smoke source set is not part of the jar.

def mc = sc.current.version
def smokeDir = rootProject.layout.buildDirectory.dir("run/smoke/${mc}").get().asFile
def plain = project.hasProperty("smokePlain")
def freshAnimations = !plain && !project.hasProperty("smokeNoPack")
def freshAnimationsName = project.ext.freshAnimationsZip.name
def gameJava = project.ext.javaVersion

// The test sees the mod and the game the way the client does.
sourceSets {
	smoke {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
	}
}

loom {
	mods {
		"horsingaround-smoke" {
			sourceSet sourceSets.smoke
		}
	}
	runs {
		smoke {
			client()
			source sourceSets.smoke
			runDir "../../build/run/smoke/${mc}"
			vmArg "-Dhorsingaround.smoke=true"
			vmArg "-Xmx2G"
			if (project.hasProperty("smokeWild")) {
				vmArg "-Dhorsingaround.smoke.wild=${project.property('smokeWild')}"
				if (project.hasProperty("smokeWildAt")) {
					vmArg "-Dhorsingaround.smoke.wildAt=${project.property('smokeWildAt')}"
				}
			}
			if (project.hasProperty("smokeWithoutMod")) {
				vmArg "-Dfabric.debug.disableModIds=horsingaround"
				vmArg "-Dhorsingaround.smoke.withoutMod=true"
			}
			ideConfigGenerated false
		}
	}
}

// One smoke game at a time (the versions share Loom's download caches, and every game opens a window).
abstract class SmokeGame implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}
def smokeGame = gradle.sharedServices.registerIfAbsent("smokeGame", SmokeGame) { maxParallelUsages = 1 }

// What the game starts with: the Fresh Animations pack on (unless -PsmokeNoPack or -PsmokePlain) and light settings.
def optionsText = [
	'resourcePacks:["vanilla"' + (freshAnimations ? ',"file/' + freshAnimationsName + '"' : '') + ']',
	'incompatibleResourcePacks:[]',
	'renderDistance:6',
	'simulationDistance:5',
	'maxFps:30',
	'enableVsync:false',
	'graphicsMode:0',
	'fancyGraphics:false',
	'particles:2',
	'soundCategory_master:0.0',
	'pauseOnLostFocus:false',
	'onboardAccessibility:false',
	'tutorialStep:none',
	'narrator:0',
	'skipMultiplayerWarning:true',
	'joinedFirstServer:true',
	'chatVisibility:0',
	'touchscreen:false',
].join("\n") + "\n"

// Problems that name this mod, or a mixin that could not be applied.
def smokeProblem = ~/(?i)(Mixin apply failed|Injection validation failed|could not find any targets|InvalidInjectionException|InvalidMixinException|MixinApplyError|MixinTransformerError|Critical injection failure|smoke test failed|\/(ERROR|FATAL)\].*horsing.?around|^\s+at dev\.horsingaround\.)/
def serverCorrection = ~/moved wrongly|moved too quickly|was expected to be controlling/
def withoutMod = project.hasProperty("smokeWithoutMod")

tasks.matching { it.name == "runSmoke" }.configureEach { task ->
	task.group = "verification"
	task.description = "Runs the smoke test in a client of Minecraft ${mc}: a short ride with screenshots (build/run/smoke/${mc}/)."
	task.dependsOn "installFreshAnimations"
	task.usesService(smokeGame)
	// The versions run in one fixed order, after every version's downloads (they share Loom's asset cache).
	task.mustRunAfter(rootProject.childProjects.values().collectMany { other ->
		["${other.path}:downloadAssets"] + (other.name < mc ? ["${other.path}:runSmoke"] : [])
	})
	// On the Java players run this version with (the old loaders' Mixin can't read a newer Java's classes).
	task.javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(gameJava) }
	task.timeout = java.time.Duration.ofMinutes(15)
	task.doFirst {
		new File(smokeDir, "logs").deleteDir()
		new File(smokeDir, "screenshots").deleteDir()
		smokeDir.mkdirs()
		new File(smokeDir, "options.txt").text = optionsText
	}
	task.doLast {
		def log = new File(smokeDir, "logs/latest.log")
		def lines = log.exists() ? log.readLines() : []
		def problems = lines.findAll { it =~ smokeProblem }
		def corrections = lines.findAll { it =~ serverCorrection }
		if (!lines.any { it.contains("Horsing Around smoke test passed") } || !problems.isEmpty()) {
			throw new GradleException("Smoke test failed on ${mc}; see ${log}\n" + (problems + lines.findAll { it.contains("smoke test") }).take(30).join("\n"))
		}
		if (!corrections.isEmpty() && !withoutMod) {
			throw new GradleException("Smoke test failed on ${mc}: the server corrected the rider's moves (rubber-banding); see ${log}\n" + corrections.take(10).join("\n"))
		}
		logger.lifecycle(lines.findAll { it.contains("smoke test passed") }.first().replaceFirst(/^.*?\) /, ""))
		if (!corrections.isEmpty()) {
			logger.warn("${corrections.size()} server corrections (rubber-banding) in the log of ${mc}, with the mod off")
		}
		logger.lifecycle("Smoke test passed on ${mc}; screenshots in ${smokeDir}/screenshots")
	}
}
