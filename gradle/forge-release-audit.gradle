// The release jar's mixin audit in a production Forge client and dedicated server, for the Forge jars no dev game can
// load: before 1.20.5 Forge runs the game on its own names (SRG) and the dev games on Mojang's, so only a real Forge
// loads the renamed jar and its refmaps. Applied by build.neoforge.gradle (Forge 1.20.1) and build.forge.gradle (1.20.2
// and 1.20.4), which set ext.releaseAuditJar (the release jar's file) and one of ext.releaseAuditAssets (a properties
// file naming the client's assets) or ext.releaseAuditAssetsRoot (a folder of them, with the task that fills it in
// ext.releaseAuditAssetsTask), and may add mods to the releaseAuditMods configuration. Makes runAuditReleaseClient and
// runAuditReleaseServer in build/run/audit/<node>-release/, which the build script's auditMixins runs and checks.
def mc = project.minecraft_version
def javaVersion = project.ext.javaVersion
def releaseAuditDir = rootProject.layout.buildDirectory.dir("run/audit/${project.name}-release").get().asFile
ext.releaseAuditDir = releaseAuditDir
// (Forge's installer, by its own address: ForgeGradle's local copy of Forge, which answers for Forge's name, has none.)
repositories {
	exclusiveContent {
		forRepository {
			ivy {
				name = 'ForgeInstaller'
				url = 'https://maven.minecraftforge.net/'
				patternLayout { artifact 'net/minecraftforge/forge/[revision]/forge-[revision]-[classifier].[ext]' }
				metadataSources { artifact() }
			}
		}
		filter { includeGroup 'forge-installer' }
	}
}
configurations.register("forgeInstaller") { transitive = false }
configurations.maybeCreate("releaseAuditMods").transitive = false
dependencies {
	forgeInstaller "forge-installer:forge:${mc}-${project.forge_version}:installer@jar"
}
def installReleaseGames = tasks.register("installReleaseGames", InstallForgeGames) {
	installer.from(configurations.named("forgeInstaller"))
	minecraftVersion = mc
	forgeVersion = project.forge_version
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(javaVersion) }
	clientLaunch = new File(releaseAuditDir, "client/launch.json")
	serverLaunch = new File(releaseAuditDir, "server/launch.json")
}
def releaseMods = files(project.ext.releaseAuditJar, configurations.named("releaseAuditMods"))
def assets = project.ext.has("releaseAuditAssets") ? project.ext.releaseAuditAssets : null
def assetsRoot = project.ext.has("releaseAuditAssetsRoot") ? project.ext.releaseAuditAssetsRoot : null
def assetsTask = project.ext.has("releaseAuditAssetsTask") ? project.ext.releaseAuditAssetsTask : null
["Client", "Server"].each { side ->
	def gameDir = new File(releaseAuditDir, side.toLowerCase())
	def launch = installReleaseGames.flatMap { side == "Client" ? it.clientLaunch : it.serverLaunch }
	tasks.register("runAuditRelease${side}", JavaExec) {
		description = "Runs the release jar's mixin audit in a production Forge ${side.toLowerCase()}."
		javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(javaVersion) }
		workingDir = gameDir
		mainClass = launch.map { new groovy.json.JsonSlurper().parse(it.asFile).mainClass as String }
		classpath(launch.map { new groovy.json.JsonSlurper().parse(it.asFile).classpath })
		jvmArgs "-Dhorsingaround.audit=true", "-Dmixin.debug.countInjections=true"
		jvmArgumentProviders.add(new ForgeLaunchArgs(launch: launch, part: "jvm"))
		argumentProviders.add(new ForgeLaunchArgs(launch: launch, part: "game", assets: side == "Client" ? assets : null, assetsRoot: side == "Client" ? assetsRoot : null))
		if (side == "Client" && assetsTask != null) {
			dependsOn assetsTask
		}
		inputs.files(releaseMods)
		doFirst {
			def mods = new File(gameDir, "mods")
			mods.deleteDir()
			mods.mkdirs()
			releaseMods.each { java.nio.file.Files.copy(it.toPath(), new File(mods, it.name).toPath()) }
		}
	}
}

// Forge's installer makes a production client and dedicated server, once per Forge version, and each side's launch.json
// says how to start it: the server's comes from Forge's own argument file, the client's is built from the version JSONs as a
// launcher builds it (the installer leaves the vanilla libraries to the launcher: fetched here, by sha1).
abstract class InstallForgeGames extends DefaultTask {
	@InputFiles @PathSensitive(PathSensitivity.NONE) abstract ConfigurableFileCollection getInstaller()
	@Input abstract Property<String> getMinecraftVersion()
	@Input abstract Property<String> getForgeVersion()
	@Nested abstract Property<JavaLauncher> getJavaLauncher()
	@OutputFile abstract RegularFileProperty getClientLaunch()
	@OutputFile abstract RegularFileProperty getServerLaunch()
	@javax.inject.Inject abstract ExecOperations getExec()

	@TaskAction
	void install() {
		def mc = minecraftVersion.get()
		def forge = "${mc}-${forgeVersion.get()}"
		def id = "${mc}-forge-${forgeVersion.get()}".toString()
		def client = clientLaunch.get().asFile.parentFile
		def server = serverLaunch.get().asFile.parentFile
		[client, server].each { it.deleteDir(); it.mkdirs() }
		// (The client install adds itself to a launcher's profile list.)
		new File(client, "launcher_profiles.json").text = '{"profiles":{}}\n'
		runInstaller("--installServer", server)
		runInstaller("--installClient", client)

		// Forge's argument file has an option (and its value) per line, then the main class, then the game's arguments.
		def serverLine = [mainClass: null, jvm: [], classpath: [], game: []]
		def windows = System.getProperty("os.name").startsWith("Windows")
		new File(server, "libraries/net/minecraftforge/forge/${forge}/${windows ? 'win' : 'unix'}_args.txt").readLines()*.trim().findAll { it && !it.startsWith("#") }.each { line ->
			if (serverLine.mainClass == null && !line.startsWith("-")) {
				serverLine.mainClass = line
			} else {
				serverLine[serverLine.mainClass == null ? "jvm" : "game"].addAll((line =~ /"([^"]*)"|(\S+)/).collect { it[1] != null ? it[1] : it[2] })
			}
		}
		serverLine.game << "nogui"
		// (From 1.20.3 Forge's server starts from a jar of its own, named in the argument file.)
		def jarFlag = serverLine.jvm.indexOf("-jar")
		if (serverLine.mainClass == null && jarFlag >= 0) {
			def shim = new File(server, serverLine.jvm[jarFlag + 1])
			serverLine.mainClass = new java.util.jar.JarFile(shim).withCloseable { it.manifest.mainAttributes.getValue("Main-Class") }
			serverLine.classpath = [shim.absolutePath]
			serverLine.jvm = serverLine.jvm.take(jarFlag) + serverLine.jvm.drop(jarFlag + 2)
		}
		serverLaunch.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(serverLine))

		def libraries = new File(client, "libraries")
		def forgeJson = new groovy.json.JsonSlurper().parse(new File(client, "versions/${id}/${id}.json"))
		def vanillaFile = new File(client, "versions/${mc}/${mc}.json")
		if (!vanillaFile.exists()) {
			def manifest = new groovy.json.JsonSlurper().parse(URI.create("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json").toURL())
			def entry = manifest.versions.find { it.id == mc }
			download(entry.url, entry.sha1, vanillaFile)
		}
		def vanilla = new groovy.json.JsonSlurper().parse(vanillaFile)
		def gameJar = new File(client, "versions/${mc}/${mc}.jar")
		if (!gameJar.exists()) download(vanilla.downloads.client.url, vanilla.downloads.client.sha1, gameJar)
		// Forge's libraries first: one of each (group, name and classifier).
		def classpath = []
		def seen = [] as Set
		(forgeJson.libraries + vanilla.libraries).findAll { allowed(it.rules) && it.downloads?.artifact }.each { lib ->
			def coordinates = lib.name.split(":") as List
			if (!seen.add((coordinates.take(2) + coordinates.drop(3)).join(":"))) return
			def artifact = lib.downloads.artifact
			def file = new File(libraries, artifact.path)
			if (!file.exists()) {
				if (!artifact.url) throw new GradleException("Forge's installer didn't make ${file}")
				download(artifact.url, artifact.sha1, file)
			}
			classpath << file.absolutePath
		}
		// The game jar goes last, under the Forge version's name, which Forge's ignoreList keeps off the module path.
		def versionJar = new File(client, "versions/${id}/${id}.jar")
		java.nio.file.Files.copy(gameJar.toPath(), versionJar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		classpath << versionJar.absolutePath
		def natives = new File(client, "natives")
		natives.mkdirs()
		def values = [library_directory: libraries.absolutePath, classpath_separator: File.pathSeparator, version_name: id,
			natives_directory: natives.absolutePath, launcher_name: "horsingaround-audit", launcher_version: "1", classpath: '${classpath}',
			auth_player_name: "Dev", game_directory: client.absolutePath, auth_uuid: "0" * 32, auth_access_token: "0", clientid: "0",
			auth_xuid: "0", user_type: "legacy", version_type: "release",
			// (At run time, from the assets the build script names: ForgeLaunchArgs.)
			assets_root: '${assets_root}', assets_index_name: '${assets_index_name}']
		def jvm = arguments(vanilla.arguments.jvm + forgeJson.arguments.jvm, values)
		// (The classpath is the task's own.)
		def cp = jvm.indexOf("-cp")
		if (cp < 0 || jvm[cp + 1] != '${classpath}') throw new GradleException("${vanillaFile} has no -cp \${classpath}")
		jvm = jvm.take(cp) + jvm.drop(cp + 2)
		def game = arguments(vanilla.arguments.game + forgeJson.arguments.game, values)
		def unknown = ((jvm + game).join(" ").findAll(/\$\{\w+\}/) as Set) - ['${assets_root}', '${assets_index_name}']
		if (unknown) throw new GradleException("The client's arguments ask for ${unknown}, which this task doesn't fill in")
		def clientLine = [mainClass: forgeJson.mainClass, jvm: jvm, classpath: classpath, game: game, minecraft: mc, assetIndex: vanilla.assetIndex.id]
		clientLaunch.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(clientLine))
	}

	void runInstaller(String mode, File dir) {
		def log = new File(dir.parentFile, "install-${dir.name}.log")
		def result = log.withOutputStream { out ->
			exec.exec { spec ->
				spec.executable(javaLauncher.get().executablePath.asFile.absolutePath)
				spec.args("-jar", installer.singleFile.absolutePath, mode, dir.absolutePath)
				spec.workingDir(dir)
				spec.standardOutput = out
				spec.errorOutput = out
				spec.ignoreExitValue = true
			}
		}
		if (result.exitValue != 0) throw new GradleException("Forge's installer (${mode}) failed; see ${log}")
	}

	// A version JSON's arguments, those whose rules this system passes, with the values filled in.
	static List<String> arguments(List args, Map values) {
		args.collectMany { arg ->
			if (arg instanceof Map) {
				if (!allowed(arg.rules)) return []
				arg = arg.value
			}
			(arg instanceof List ? arg : [arg]).collect { String s -> s.replaceAll(/\$\{(\w+)\}/) { all, key -> values.containsKey(key) ? values[key].toString() : all } }
		}
	}

	// A launcher's rules: the last that fits this system decides; none, allowed. (No launcher features: no demo, no quick play.)
	static boolean allowed(List rules) {
		if (!rules) return true
		def os = System.getProperty("os.name").toLowerCase()
		def name = os.startsWith("windows") ? "windows" : os.contains("mac") ? "osx" : "linux"
		def allow = false
		rules.each { rule ->
			if (!rule.features && (!rule.os?.name || rule.os.name == name) && (!rule.os?.arch || rule.os.arch == System.getProperty("os.arch"))) {
				allow = rule.action == "allow"
			}
		}
		allow
	}

	static void download(String url, String sha1, File to) {
		to.parentFile.mkdirs()
		def part = new File(to.parentFile, "${to.name}.part")
		def digest = java.security.MessageDigest.getInstance("SHA-1")
		URI.create(url).toURL().openStream().withCloseable { input ->
			part.withOutputStream { out ->
				input.eachByte(65536) { byte[] buffer, int n ->
					digest.update(buffer, 0, n)
					out.write(buffer, 0, n)
				}
			}
		}
		def got = HexFormat.of().formatHex(digest.digest())
		if (sha1 && got != sha1) {
			part.delete()
			throw new GradleException("${url} came with sha1 ${got}, not ${sha1}")
		}
		java.nio.file.Files.move(part.toPath(), to.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}

// One part of a launch.json (jvm or game) as arguments, with the client's assets: a properties file naming them
// (ModDevGradle's download, which its dev games use too), or a folder of them with the index the launch.json names.
class ForgeLaunchArgs implements CommandLineArgumentProvider {
	@InputFile @PathSensitive(PathSensitivity.NONE) Provider<RegularFile> launch
	@Input String part
	@InputFile @PathSensitive(PathSensitivity.NONE) @Optional Provider<RegularFile> assets
	@Input @Optional String assetsRoot

	Iterable<String> asArguments() {
		def json = new groovy.json.JsonSlurper().parse(launch.get().asFile)
		List<String> args = json[part]
		if (assets == null && assetsRoot == null) return args
		def root = assetsRoot
		// (Fabric Loom keeps an index under its Minecraft version's name too.)
		def index = root != null && new File(root, "indexes/${json.minecraft}-${json.assetIndex}.json").exists() ? "${json.minecraft}-${json.assetIndex}" : json.assetIndex
		if (assets != null) {
			def found = new Properties()
			assets.get().asFile.withInputStream { found.load(it) }
			root = found.getProperty("assets_root")
			index = found.getProperty("asset_index")
		}
		args.collect { it.replace('${assets_root}', root).replace('${assets_index_name}', index.toString()) }
	}
}

