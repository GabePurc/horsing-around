org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties (https://fabricmc.net/develop). Per-Minecraft-version numbers (Minecraft, Fabric API, optional
# integrations) are in versions/<version>/gradle.properties.
# (26.3, the main version; the others ask for the oldest their Fabric API accepts, in their own properties)
loader_version=0.19.5
# Bundled into the jars for a Fabric Loader older than 0.16 (see build.gradle)
mixinextras_version=0.4.1
loomx.loom_version=1.18-SNAPSHOT

# Mod Properties (jars are named horsing-around-<version>+<minecraft version>.jar)
version=0.3.1
group=dev.horsingaround

# Dev-only Fresh Animations pack (not shipped; older Minecraft versions name their own in versions/<version>/)
fresh_animations_file=FreshAnimations_v1.10.5.zip
fresh_animations_url=https://cdn.modrinth.com/data/50dA9Sha/versions/RGIzA5em/FreshAnimations_v1.10.5.zip

# Dev runtime: the Over the Shoulder add-on, built in a sibling checkout (separate repo), for runClient (optional).
# Comma-separated; the first folder with a jar wins. Override in ~/.gradle/gradle.properties for other layouts.
over_the_shoulder_libs=../Over the Shoulder/build/libs,../horsing-around-over-the-shoulder/build/libs
