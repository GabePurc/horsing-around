plugins {
	id 'dev.kikugie.loom-back-compat'
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

// Built once per Minecraft version (Stonecutter node, see settings.gradle); this node's numbers come from
// versions/<version>/gradle.properties. 26.3 is the main version: the client tests and compatibility runs live there
// (gradle/client-tests.gradle), and its game and test folders are the repo's run/ and build/run/.
def mc = sc.current.version
def mainVersion = mc == '26.3'
def javaVersion = sc.current.parsed.matches('>=26') ? 25 : sc.current.parsed.matches('>=1.20.5') ? 21 : 17
ext.javaVersion = javaVersion // (for gradle/smoke-test.gradle)
version = "${project.version}+${mc}"
base.archivesName = 'horsing-around'
// Repo-level folders (each node's own project folder is versions/<version>/).
def repoDir = rootProject.layout.projectDirectory
def runFolder = mainVersion ? 'run' : "run/versions/${mc}"

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	runs.matching { it.name in ["client", "server"] }.configureEach { runDir "../../${runFolder}" }

	mods {
		"horsingaround" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Before 26 the game is obfuscated at runtime: the mixin annotation processor writes the refmap that maps our Mojang
// method names to the runtime ones.
if (sc.current.parsed.matches('<26')) {
	loom.mixin.useLegacyMixinAp = true
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	loomx.applyMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The mixins use MixinExtras 0.4 (@WrapMethod), which Fabric Loader bundles from 0.16 on: for an older loader the
	// jar carries its own copy (the loader then runs the newest copy any mod brings).
	// (Decided by the oldest loader the jar claims to run on, see loader_minimum in gradle.properties.)
	def (loaderMajor, loaderMinor) = (project.findProperty('loader_minimum') ?: project.loader_version).tokenize('.')*.toInteger()
	if (loaderMajor == 0 && loaderMinor < 16) {
		include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}")))
	}

	// Optional integration: ride the horse's real animated body when Entity Model Features animates it.
	modCompileOnly "maven.modrinth:entity-model-features:${project.emf_version}"
	modCompileOnly "maven.modrinth:entitytexturefeatures:${project.etf_version}"
	// Optional integration: settings screen in Mod Menu.
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	// Optional integration: the riding camera steps aside while Shoulder Surfing Reloaded drives the camera.
	modCompileOnly "maven.modrinth:shoulder-surfing-reloaded:${project.shoulder_surfing_version}"

	// Dev-only: Mod Menu, to reach the add-on's settings screen in runClient.
	modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	modLocalRuntime "maven.modrinth:placeholder-api:${project.placeholder_api_version}"

	// Dev-only: the Fresh Animations stack, so runClient and the ride test look like the target setup. (-PsmokePlain
	// leaves it off, see gradle/smoke-test.gradle.)
	if (!project.hasProperty("smokePlain")) {
		modLocalRuntime "maven.modrinth:entity-model-features:${project.emf_version}"
		modLocalRuntime "maven.modrinth:entitytexturefeatures:${project.etf_version}"
	}
}

// Fresh Animations is a resource pack; fetch it once and drop it into both dev run folders.
def freshAnimationsZip = repoDir.file(".gradle/dev-packs/${project.fresh_animations_file}").asFile
ext.freshAnimationsZip = freshAnimationsZip
def freshAnimationsUrl = project.fresh_animations_url
def freshAnimationsTargets = [
	repoDir.dir("${runFolder}/resourcepacks").asFile,
	rootProject.layout.buildDirectory.dir("run/smoke/${mc}/resourcepacks").get().asFile
]
if (mainVersion) {
	freshAnimationsTargets << rootProject.layout.buildDirectory.dir("run/clientGameTest/resourcepacks").get().asFile
}
def installFreshAnimations = tasks.register("installFreshAnimations") {
	outputs.files(freshAnimationsTargets.collect { new File(it, freshAnimationsZip.name) })
	doLast {
		if (!freshAnimationsZip.exists()) {
			// (Into a file of its own first, then moved into place whole: two versions' games started together may both download it.)
			freshAnimationsZip.parentFile.mkdirs()
			def part = File.createTempFile(freshAnimationsZip.name, ".part", freshAnimationsZip.parentFile)
			try {
				new URI(freshAnimationsUrl).toURL().withInputStream { input -> part.withOutputStream { it << input } }
				java.nio.file.Files.move(part.toPath(), freshAnimationsZip.toPath(), java.nio.file.StandardCopyOption.ATOMIC_MOVE, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			} finally {
				part.delete()
			}
		}
		freshAnimationsTargets.each { dir ->
			dir.mkdirs()
			java.nio.file.Files.copy(freshAnimationsZip.toPath(), new File(dir, freshAnimationsZip.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}
tasks.matching { it.name == "runClient" }.configureEach { dependsOn installFreshAnimations }
// Plain "runClient" would start every version's game: only the main version's answers to it, the others only by path
// (./gradlew :1.21.11:runClient).
if (!mainVersion) {
	tasks.matching { it.name == "runClient" }.configureEach { task ->
		// (Run from this version's own folder, -p versions/<version>, it answers to plain "runClient" too.)
		def plainEverywhere = gradle.startParameter.taskNames.contains("runClient") && (gradle.startParameter.projectDir ?: gradle.startParameter.currentDir) != projectDir
		task.onlyIf("plain runClient starts only the main version's game; use :${mc}:runClient") { !plainEverywhere }
	}
}

// ./gradlew :<version>:auditMixins (or plain auditMixins for every version): the built jar in a production game and on
// a dedicated server of this Minecraft version, with Fabric API only; both load every class the mixins patch and quit
// (MixinAudit), and the task fails unless both say so and nothing in the log names a mixin failure. One game at a time.
abstract class AuditGame implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}
def auditGame = gradle.sharedServices.registerIfAbsent("auditGame", AuditGame) { maxParallelUsages = 1 }
configurations.register("auditMods") { transitive = false }
dependencies {
	auditMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
def auditJvmArgs = ["-Dhorsingaround.audit=true", "-Dmixin.debug.countInjections=true"]
def auditTasks = ["Client": net.fabricmc.loom.task.prod.ClientProductionRunTask, "Server": net.fabricmc.loom.task.prod.ServerProductionRunTask]
auditTasks.each { side, type ->
	def auditDir = rootProject.layout.buildDirectory.dir("run/audit/${mc}/${side.toLowerCase()}").get().asFile
	tasks.register("audit${side}Mixins", type) {
		group = "verification"
		description = "Loads every mixin target in a production ${side.toLowerCase()} of Minecraft ${mc} and fails on a mixin that doesn't fit."
		usesService(auditGame)
		// The versions' games share Loom's download caches (assets): with several versions at once
		// (./gradlew auditMixins), run after every version's downloads, in one fixed order.
		def key = "${mc}:${side}"
		mustRunAfter(rootProject.childProjects.values().collectMany { other ->
			["${other.path}:downloadAssets"] + ["Client", "Server"].findAll { "${other.name}:${it}" < key }.collect { "${other.path}:audit${it}Mixins" }
		})
		mods.from(loomx.modJar.flatMap { it.archiveFile })
		mods.from(configurations.named("auditMods"))
		// On the Java players run this version with (the old loaders' Mixin can't read a newer Java's classes).
		javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(javaVersion) }
		jvmArgs.addAll(auditJvmArgs)
		if (side == "Server") {
			programArgs.add("nogui")
		}
		getRunDir().set(auditDir)
		doFirst {
			new File(auditDir, "logs").deleteDir()
			auditDir.mkdirs()
			new File(auditDir, "eula.txt").text = "eula=true\n"
		}
		doLast {
			def log = new File(auditDir, "logs/latest.log")
			def text = log.exists() ? log.text : ""
			def problems = text.readLines().findAll { it =~ /Mixin apply for mod|Mixin apply failed|Injection validation failed|could not find any targets|InvalidInjectionException|InvalidMixinException|MixinApplyError|MixinTransformerError|Critical injection failure/ }
			if (!text.contains("Horsing Around mixin audit passed") || !problems.isEmpty()) {
				throw new GradleException("Mixin audit failed on ${mc} (${side.toLowerCase()}); see ${log}\n" + problems.take(20).join("\n"))
			}
			logger.lifecycle("Mixin audit passed on ${mc} (${side.toLowerCase()}).")
		}
	}
}
tasks.register("auditMixins") {
	group = "verification"
	dependsOn "auditClientMixins", "auditServerMixins"
}

// Release to Modrinth (./gradlew publishModrinth, run by .github/workflows/publish.yml on a GitHub release).
apply from: repoDir.file('gradle/publish.gradle')

// The smoke test (src/smoke) runs on every version, the client tests below on the main one only.
apply from: repoDir.file('gradle/smoke-test.gradle')

if (mainVersion) {
	apply from: repoDir.file('gradle/client-tests.gradle')
}

// fabric.mod.json and the mixin configs carry this node's Minecraft range and Java version.
// (The cowboy hat is done with the render state from 1.21.2; before, two mixins keep a helmet off the supporter's head.)
// On Java 21 the mixin configs say JAVA_17, as Fabric API's do: Mixin before Fabric Loader 0.15.10 doesn't know JAVA_21
// and refuses the config, and nothing in our mixins needs more.
def mixinJava = javaVersion == 21 ? 17 : javaVersion
def hatMixins = sc.current.parsed.matches('>=1.21.2') ? '"AvatarRenderStateMixin", "AvatarRendererMixin",' : '"CustomHeadLayerMixin", "HumanoidArmorLayerMixin",'
def resourceProps = [version: project.version.toString(), minecraft: project.minecraft_range, loader: project.findProperty('loader_minimum') ?: project.loader_version, java: javaVersion.toString(), mixinJava: mixinJava.toString(), hatMixins: hatMixins]
tasks.matching { it.name in ["processResources", "processClientResources"] }.configureEach {
	inputs.properties resourceProps
	filesMatching(["fabric.mod.json", "*.mixins.json"]) {
		expand resourceProps
	}
}

// Data pack folders got singular names in 1.21 (tags/block); before, the tags are in plural ones (tags/blocks).
if (sc.current.parsed.matches('<1.21')) {
	tasks.named("processResources") {
		includeEmptyDirs = false
		eachFile { details ->
			details.path = details.path.replace('/tags/entity_type/', '/tags/entity_types/').replace('/tags/block/', '/tags/blocks/')
		}
	}
}

jar {
	from(repoDir.file("LICENSE")) {
		rename { "${it}_horsingaround" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}
