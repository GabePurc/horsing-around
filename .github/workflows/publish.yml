# Publishes a release: when a GitHub release is published (tag v<version>), builds every Minecraft version's jar,
# uploads each to Modrinth as a version of its own (gradle/publish.gradle) and attaches the jars to the GitHub release.
# Run by hand (Actions > publish > Run workflow) it is a dry run: nothing is uploaded, and what would go up is kept as
# the run's publish-dry-run artifact.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag is this version
        if: github.event_name == 'release'
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "The release tag $TAG is not v$version (gradle.properties)"
            exit 1
          fi
      - run: ./gradlew build
      - name: Upload to Modrinth
        if: github.event_name == 'release'
        run: ./gradlew publishModrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew publishModrinth -PpublishDryRun
      - name: Attach the jars to the GitHub release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" versions/*/build/libs/horsing-around-*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Keep what the dry run would upload
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: publish-dry-run
          path: versions/*/build/publishMods/
