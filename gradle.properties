org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties (https://fabricmc.net/develop). Per-Minecraft-version numbers (Minecraft, Fabric API, optional
# integrations) are in versions/<version>/gradle.properties.
# (26.3, the main version; the others ask for the oldest their Fabric API accepts, in their own properties)
# loader_version is what the dev games and audits run on. fabric.mod.json asks players for loader_minimum instead where a
# version sets one (versions/<version>/gradle.properties): the Fabric Loader its Fabric API needs, read from the API's own
# fabric.mod.json, for a version whose dev loader has to be newer than that.
# fabric.mod.json asks for fabric_api_version's Fabric API, or fabric_api_minimum where a version sets one: a jar that also covers
# an older Minecraft, whose newest Fabric API is older than that, asks for that newest one, so players on it can still run the jar.
loader_version=0.19.5
# Bundled into the jars for a Fabric Loader older than 0.16 (see build.gradle)
mixinextras_version=0.4.1
# The Modrinth project releases go to (its id or slug; gradle/publish.gradle)
modrinth_project_id=Lc7S9t3K
# The CurseForge project releases go to (its numeric id)
curseforge_project_id=1758139
# (Pinned: 1.18-SNAPSHOT floats to the newest 1.18.x, so a build could change under us.)
loomx.loom_version=1.18.4

# Mod Properties (jars are named horsing-around-<version>+<minecraft version>.jar)
version=0.8.0
group=dev.horsingaround

# Dev-only Fresh Animations pack (not shipped; older Minecraft versions name their own in versions/<version>/)
fresh_animations_file=FreshAnimations_v1.10.5.zip
fresh_animations_url=https://cdn.modrinth.com/data/50dA9Sha/versions/RGIzA5em/FreshAnimations_v1.10.5.zip

