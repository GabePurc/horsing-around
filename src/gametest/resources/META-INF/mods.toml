# The client tests' mod metadata on Forge (fabric.mod.json is Fabric's, neoforge.mods.toml NeoForge's). Test only, never
# shipped. The mixin configs are named in the test jar's manifest (gradle/client-tests-forge.gradle).
modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0-only"

[[mods]]
modId = "horsingaround_gametest"
version = "1.0.0"
displayName = "Horsing Around tests"
description = "Test only, never shipped: the client tests and their harness, run by ./gradlew runClientGameTest."

[[dependencies.horsingaround_gametest]]
modId = "horsingaround"
mandatory = true
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
