# Publishes a release: when a GitHub release is published (tag v<version>), builds every Minecraft version's jar,
# attaches the jars to the GitHub release and uploads each to Modrinth and CurseForge as a version of its own
# (gradle/publish.gradle).
# Run by hand (Actions > publish > Run workflow) it is a dry run: nothing is uploaded, and what would go up is kept as
# the run's publish-dry-run artifact. Ticking "curseforge" instead uploads the chosen branch's jars to CurseForge only
# (for a release that never reached it).
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      curseforge:
        description: Upload this branch's jars to CurseForge for real (otherwise a dry run)
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag is this version
        if: github.event_name == 'release'
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "The release tag $TAG is not v$version (gradle.properties)"
            exit 1
          fi
      - run: ./gradlew build
      # (The jars go onto the GitHub release first: an upload that fails part-way leaves the release complete.)
      - name: Attach the jars to the GitHub release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" versions/*/build/libs/horsing-around-*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # (--continue: one version or site failing to upload doesn't stop the others; the step still fails. A GitHub
      # pre-release goes up as a beta, see gradle/publish.gradle.)
      - name: Upload to Modrinth and CurseForge
        if: github.event_name == 'release'
        run: ./gradlew publishModrinth publishCurseforge --continue ${{ github.event.release.prerelease && '-PpublishBeta' || '' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      - name: Upload to CurseForge only
        if: github.event_name == 'workflow_dispatch' && inputs.curseforge
        run: ./gradlew publishCurseforge --continue
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.curseforge
        run: ./gradlew publishModrinth publishCurseforge -PpublishDryRun
      - name: Keep what the dry run would upload
        if: github.event_name == 'workflow_dispatch' && !inputs.curseforge
        uses: actions/upload-artifact@v4
        with:
          name: publish-dry-run
          path: versions/*/build/publishMods/
