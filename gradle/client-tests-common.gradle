// The client tests' runs, the same on every loader: what runs (-Ptests, -Psections, -Pscenario), the light test games,
// and the shards with their merged reports. The loader's own script (client-tests.gradle for Fabric,
// client-tests-neoforge.gradle for NeoForge, client-tests-forge.gradle for Forge) applies this first, then registers the
// clientGameTest run and one per shard (clientGameTest<Shard>, from testShards) in the folders named here:
// build/run/<runs>/ and build/run/<runs>-<shard>/, where <runs> is clientTestRuns (clientGameTest on Fabric 26.3).
def runBase = project.ext.clientTestRuns
// The game's task for a run ("" or a shard): runClientGameTest<Shard>, with the loader's ending where its plugin adds one.
def taskSuffix = project.ext.has("clientTestTaskSuffix") ? project.ext.clientTestTaskSuffix : ""
def gameTask = { String shard -> "runClientGameTest${shard}${taskSuffix}".toString() }
// The loader's own touches to a fresh test game folder (NeoForge: no screen of load warnings before the title screen).
def prepareRunDir = project.ext.has("prepareClientTestDir") ? project.ext.prepareClientTestDir : { File dir -> }

tasks.register("deleteClientGameTestRunDir", Delete) {
	delete rootProject.layout.buildDirectory.dir("run/${runBase}")
}
tasks.matching { it.name == gameTask("") }.configureEach { dependsOn "deleteClientGameTestRunDir" }

// (Set by the build script, where the version has Entity Model Features to animate the pack; a local so task actions can
// see it.)
def freshAnimationsZip = project.ext.has("freshAnimationsZip") ? project.ext.freshAnimationsZip : null
if (freshAnimationsZip != null) {
	tasks.named("installFreshAnimations") { mustRunAfter "deleteClientGameTestRunDir" }
}

// Test colours (src/gametest/debugpack): in the client tests horses' legs are colour-coded (upper leg blue, knee white,
// lower leg orange, hoof black, sole magenta) so screenshots show what each piece is doing; -PplainTextures turns it off.
def installDebugPack = tasks.register("installDebugPack", Sync) {
	from rootProject.layout.projectDirectory.dir("src/gametest/debugpack/horsingaround-debug")
	into rootProject.layout.buildDirectory.dir("run/${runBase}/resourcepacks/horsingaround-debug")
}
installDebugPack.configure { mustRunAfter "deleteClientGameTestRunDir" }

// Client tests: ./gradlew runClientGameTest runs the ride test, the natural-terrain test, every vanilla mount, and a ride
// on a dedicated server; pick some with -Ptests=ride,terrain,mounts,server, one terrain scenario with
// -Pscenario=<part of its name>, and only some sections of the ride test with -Psections=<names> (core, stairs,
// picking, steps).
def clientTests = project.findProperty("tests") ?: "ride,terrain,mounts,server,hat,settings"
def terrainScenario = project.findProperty("scenario") ?: ""
def rideSections = project.findProperty("sections") ?: ""
// Test games run light, to keep the load on the machine down: the lowest settings, no sound (LowSettings in the tests),
// a 2 GB heap, and performance mods (-PplainGame runs without them, -PfullGraphics with normal settings; the gallery and
// store shots always get normal settings). They also run as fast as they can draw (TestClock; -PrealTime for normal speed).
def lowSettings = !project.hasProperty("fullGraphics") && !clientTests.contains("gallery") && !clientTests.contains("store")
// The server test starts a local dedicated server in the test run folder; the user accepted the Minecraft EULA
// (https://aka.ms/MinecraftEULA) for it on 2026-10-07.
def gameTestEula = rootProject.layout.buildDirectory.file("run/${runBase}/eula.txt").get().asFile
// On the Java players run this version with (the old loaders' Mixin can't read a newer Java's classes).
def testGameJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.ext.javaVersion) }
def lightTestGame = { task ->
	task.javaLauncher = testGameJava
	task.systemProperty "horsingaround.lowSettings", lowSettings
	task.systemProperty "horsingaround.frameClock", lowSettings && !clientTests.contains("perf") && !project.hasProperty("realTime")
	task.systemProperty "horsingaround.smooth", project.findProperty("smooth") ?: ""
	task.systemProperty "horsingaround.smoothDump", project.findProperty("smoothDump") ?: ""
	task.maxHeapSize = "2G"
	if (project.hasProperty("profile")) {
		// A Java Flight Recorder recording of the whole run, for finding what the mod costs (docs/testing.md).
		task.jvmArgs "-XX:StartFlightRecording=filename=horsingaround-profile.jfr,settings=profile,jdk.ExecutionSample#period=1ms,dumponexit=true"
	}
}
tasks.matching { it.name == gameTask("") }.configureEach {
	doFirst {
		gameTestEula.parentFile.mkdirs()
		gameTestEula.text = "eula=true\n"
		prepareRunDir(gameTestEula.parentFile)
	}
	systemProperty "horsingaround.tests", clientTests
	systemProperty "horsingaround.scenario", terrainScenario
	systemProperty "horsingaround.sections", rideSections
	systemProperty "horsingaround.plainTextures", project.hasProperty("plainTextures")
	systemProperty "horsingaround.vanillaModel", project.hasProperty("vanillaModel")
	dependsOn installDebugPack
	lightTestGame(it)
}
if (freshAnimationsZip != null) {
	tasks.matching { it.name in ["runClient", gameTask("")] }.configureEach { dependsOn "installFreshAnimations" }
}

// Faster: ./gradlew runClientGameTestParallel --continue runs the same client tests split into
// shards, each a light game in its own folder (build/run/<runs>-<shard>/), two at a time by default so the
// machine keeps room for other work (-PtestGames=N for more or fewer at once). The configuration cache (on in
// gradle.properties) is what lets Gradle run them side by side; --continue lets the others finish when one fails. The
// shards' reports are then merged into build/run/<runs>/ and every failed check is listed.
def testShards = ext.testShards = [
	RideA  : [tests: "ride", sections: "core,ledges,cuts,landings"],
	RideB  : [tests: "ride", sections: "stairs,picking"],
	RideC  : [tests: "ride", sections: "steps,climbs"],
	Terrain: [tests: "terrain", sections: ""],
	Others : [tests: "mounts,server,hat,settings", sections: ""],
]
// At most this many test games at once (-PtestGames=N), whatever Gradle's own worker count.
abstract class TestGameSlots implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}
def testGameSlots = gradle.sharedServices.registerIfAbsent("testGameSlots", TestGameSlots) {
	maxParallelUsages = (project.findProperty("testGames") ?: "2") as int
}
def debugPackSource = rootProject.layout.projectDirectory.dir("src/gametest/debugpack/horsingaround-debug").asFile
def copyDebugPack = { File into ->
	def from = debugPackSource.toPath()
	java.nio.file.Files.walk(from).each { path ->
		def target = into.toPath().resolve(from.relativize(path).toString())
		if (java.nio.file.Files.isDirectory(path)) {
			java.nio.file.Files.createDirectories(target)
		} else {
			java.nio.file.Files.copy(path, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}
def shardDirs = testShards.collectEntries { name, shard -> [name, rootProject.layout.buildDirectory.dir("run/${runBase}-${name.toLowerCase()}").get().asFile] }
// The reports a shard's tests write (each test writes horsingaround-<test>-report.txt).
def shardReports = testShards.collectEntries { name, shard -> [name, shard.tests.split(",").collect { "horsingaround-${it}-report.txt".toString() }] }
// Which shards started in this build: the collector merges only those (the folders of the others hold an earlier run's).
abstract class ShardRuns implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {
	final Set<String> started = java.util.concurrent.ConcurrentHashMap.newKeySet()
}
def shardRuns = gradle.sharedServices.registerIfAbsent("shardRuns-${project.name}", ShardRuns) {}
testShards.each { name, shard ->
	def dir = shardDirs[name]
	def shardName = name // (inside the task's closure, "name" is the task's)
	tasks.matching { it.name == gameTask(shardName) }.configureEach {
		if (freshAnimationsZip != null) {
			dependsOn "installFreshAnimations"
		}
		usesService(shardRuns)
		doFirst {
			shardRuns.get().started.add(shardName)
			// A fresh folder each run, with the Fresh Animations pack, the test colours and the EULA for the server test.
			dir.deleteDir()
			new File(dir, "resourcepacks").mkdirs()
			if (freshAnimationsZip != null) {
				java.nio.file.Files.copy(freshAnimationsZip.toPath(), new File(dir, "resourcepacks/" + freshAnimationsZip.name).toPath())
			}
			copyDebugPack(new File(dir, "resourcepacks/horsingaround-debug"))
			new File(dir, "eula.txt").text = "eula=true\n"
			prepareRunDir(dir)
		}
		systemProperty "horsingaround.tests", shard.tests
		systemProperty "horsingaround.scenario", ""
		systemProperty "horsingaround.sections", shard.sections
		systemProperty "horsingaround.plainTextures", project.hasProperty("plainTextures")
		systemProperty "horsingaround.vanillaModel", project.hasProperty("vanillaModel")
		usesService(testGameSlots)
		lightTestGame(it)
	}
}
def mergedReports = rootProject.layout.buildDirectory.dir("run/${runBase}").get().asFile
def collectShardReports = tasks.register("collectClientGameTestShards") {
	description = "Merges the reports of the client test shards that ran into build/run/${runBase}/ and fails on any failed check."
	usesService(shardRuns)
	doLast { task ->
		def started = shardRuns.get().started
		if (started.isEmpty()) {
			throw new GradleException("No client test shard ran in this build, so there are no reports to merge.")
		}
		mergedReports.mkdirs()
		def merged = [:]
		def failed = []
		testShards.keySet().findAll { it in started }.each { name ->
			def dir = shardDirs[name]
			shardReports[name].each { reportName ->
				def report = new File(dir, reportName)
				if (report.isFile()) {
					merged[reportName] = (merged[reportName] ?: "") + "### " + dir.name + "\n" + report.text
				} else {
					failed << "${name}: no ${reportName} (the game stopped before its test wrote one; see ${dir}/logs/latest.log)".toString()
				}
			}
		}
		merged.each { report, text ->
			new File(mergedReports, report).text = text
			text.eachLine { if (it.contains("FAIL") || it.contains("INCOMPLETE")) failed << report + ": " + it.trim() }
		}
		if (!failed.isEmpty()) {
			throw new GradleException("Failed client test checks:\n" + failed.join("\n"))
		}
		task.logger.lifecycle("All client test checks passed (${merged.size()} reports from the ${started.size()} shards that ran).")
	}
}
tasks.register("runClientGameTestParallel") {
	group = "verification"
	description = "Runs the client tests in light games side by side (use --continue; -PtestGames=N sets how many at once, 2 by default)."
	dependsOn testShards.keySet().collect { gameTask(it) }
	finalizedBy collectShardReports
}
testShards.keySet().each { name -> tasks.matching { it.name == gameTask(name) }.configureEach { finalizedBy collectShardReports } }

