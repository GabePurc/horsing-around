# Minecraft 26.2 on Forge (build.forge.gradle, with ForgeGradle).
minecraft_version=26.2
minecraft_range=[26.2,26.3)
# The game versions this jar is listed for on Modrinth (the same as minecraft_range)
game_versions=26.2
# Oldest Forge the jar asks for (mods.toml), and what it builds and audits with
forge_version=65.1.0
# The pack format in the jar's pack.mcmeta (Forge's own for this version; without a pack.mcmeta Forge loads none of the mod's assets or tags)
pack_format=107
# (Entity Model Features and Entity Texture Features have no Forge build for 26.x: compiled against NeoForge's, never run.)
emf_version=3.3.12-neoforge-26.2
etf_version=7.2.6-neoforge-26.2
shoulder_surfing_version=26.2-5.2.0+forge
