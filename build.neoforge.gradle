plugins {
	id 'net.neoforged.moddev' apply false
	id 'net.neoforged.moddev.legacyforge' apply false
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

// The NeoForge build of a Minecraft version (Stonecutter node <version>-neoforge, see settings.gradle), and the Forge one
// (<version>-forge: 1.20.1, with ModDevGradle's add-on for Forge), from the same src/ as the Fabric one (build.gradle).
// Code for one loader only sits in fabric/, neoforge/ or forge/ packages, each left out of the other loaders' builds, or in
// //? if neoforge comments. This node's numbers come from versions/<node>/gradle.properties. auditMixins loads every mixin
// target in a client and dedicated server, runSmoke rides the smoke test's course (gradle/smoke-test.gradle), and on
// NeoForge the client tests run as on Fabric (gradle/client-tests-neoforge.gradle; Forge's are to come, issue 127).
def forge = project.name.endsWith('-forge')
def loader = forge ? 'forge' : 'neoforge'
def loaderName = forge ? 'Forge' : 'NeoForge'
ext.loaderName = loaderName // (for gradle/smoke-test.gradle)
apply plugin: forge ? 'net.neoforged.moddev.legacyforge' : 'net.neoforged.moddev'
def mc = sc.current.version
def javaVersion = sc.current.parsed.matches('>=26') ? 25 : sc.current.parsed.matches('>=1.20.5') ? 21 : 17
ext.javaVersion = javaVersion // (for gradle/smoke-test.gradle)
version = "${project.version}+${mc}"
base.archivesName = "horsing-around-${loader}"
// Repo-level folders (each node's own project folder is versions/<node>/).
def repoDir = rootProject.layout.projectDirectory
def runFolder = "run/${loader}/${mc}"
// The extension both plugins share (the Forge add-on's is legacyForge).
def modDev = forge ? legacyForge : neoForge

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

// The client-only code in a source set of its own, as Fabric Loom splits it (src/client), packed into the same jar.
sourceSets {
	client {
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
	main.java.exclude 'dev/horsingaround/fabric/**', "dev/horsingaround/${forge ? 'neoforge' : 'forge'}/**"
	client.java.exclude 'dev/horsingaround/client/fabric/**', "dev/horsingaround/client/${forge ? 'neoforge' : 'forge'}/**"
	main.resources.exclude 'fabric.mod.json', forge ? 'META-INF/neoforge.mods.toml' : 'META-INF/mods.toml'
	// (Icy's Better Horses is Fabric and NeoForge only; Realistic Horse Genetics Forge only.)
	if (forge) {
		main.java.exclude 'dev/horsingaround/mixin/icy/**'
		client.java.exclude 'dev/horsingaround/client/mixin/icy/**'
		main.resources.exclude 'horsingaround.icy.mixins.json'
		client.resources.exclude 'horsingaround.icy.client.mixins.json', 'horsingaround.emf.client.mixins.json'
	} else {
		client.java.exclude 'dev/horsingaround/client/mixin/rhg/**'
		client.resources.exclude 'horsingaround.rhg.client.mixins.json'
	}
}
configurations {
	clientCompileOnly.extendsFrom compileOnly
	clientRuntimeOnly.extendsFrom runtimeOnly
}

configure(modDev) {
	version = forge ? "${mc}-${project.forge_version}" : project.neoforge_version
	addModdingDependenciesTo sourceSets.client

	mods {
		"horsingaround" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			sourceSet = sourceSets.client
			// Only this mod (MDG loads every declared mod by default: the smoke test's would keep the mouse free).
			loadedMods = [mods.horsingaround]
		}
		client {
			client()
			gameDirectory = repoDir.dir(runFolder)
		}
		server {
			server()
			gameDirectory = repoDir.dir("${runFolder}/server")
			programArgument '--nogui'
		}
		// ./gradlew :<node>:auditMixins (below)
		auditClient {
			client()
			gameDirectory = rootProject.layout.buildDirectory.dir("run/audit/${project.name}/client")
			systemProperty 'horsingaround.audit', 'true'
			systemProperty 'mixin.debug.countInjections', 'true'
		}
		auditServer {
			server()
			gameDirectory = rootProject.layout.buildDirectory.dir("run/audit/${project.name}/server")
			programArgument '--nogui'
			systemProperty 'horsingaround.audit', 'true'
			systemProperty 'mixin.debug.countInjections', 'true'
		}
	}
}

// (Forge for 1.20.1 runs on SRG names: other mods' jars are remapped to Mojang names for compiling against, ours back.)
def compileMod = forge ? 'modCompileOnly' : 'compileOnly'
def runtimeMod = forge ? 'modRuntimeOnly' : 'runtimeOnly'
dependencies {
	// Optional integration: ride the horse's real animated body when Entity Model Features animates it.
	add compileMod, "maven.modrinth:entity-model-features:${project.emf_version}"
	add compileMod, "maven.modrinth:entitytexturefeatures:${project.etf_version}"
	// Optional integration: the riding camera steps aside while Shoulder Surfing Reloaded drives the camera.
	add compileMod, "maven.modrinth:shoulder-surfing-reloaded:${project.shoulder_surfing_version}"

	// Dev-only: the Fresh Animations stack, so runClient looks like the target setup. (Not on Forge: its Forge jars name the
	// game's runtime names in their mixins, without a refmap, so they can't run in a dev game, which has Mojang's names.)
	if (!project.hasProperty("smokePlain") && !forge) {
		add runtimeMod, "maven.modrinth:entity-model-features:${project.emf_version}"
		add runtimeMod, "maven.modrinth:entitytexturefeatures:${project.etf_version}"
	}

	if (forge) {
		// Optional integration: Realistic Horse Genetics' horses ride, and its model gets the ride's legs (ride/Genetics).
		modCompileOnly "maven.modrinth:realistic-horse-genetics:${project.rhg_version}"
		// Dev-only: in every game (play, smoke test, mixin audit) unless -PnoGenetics. It turns every vanilla horse into one of its own.
		if (!project.hasProperty("noGenetics")) {
			modRuntimeOnly "maven.modrinth:realistic-horse-genetics:${project.rhg_version}"
		}
		// The refmaps (Mojang names to SRG) for the mixins, MixinExtras' injectors included. Forge for 1.20.1 has no
		// MixinExtras of its own: the jar carries a copy (Forge runs the newest any mod brings).
		["annotationProcessor", "clientAnnotationProcessor"].each {
			add it, "org.spongepowered:mixin:0.8.5:processor"
			add it, "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
		}
		compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
		implementation(jarJar("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"))
		// (The games run the client source set, which doesn't see the main one's implementation dependencies.)
		clientRuntimeOnly "io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"
	}
}

if (forge) {
	// The mixin configs each name their refmap; the jar's manifest lists the configs (Forge for 1.20.1 has no list in mods.toml).
	def mixinConfigs = ["horsingaround.mixins.json", "horsingaround.client.mixins.json", "horsingaround.rhg.client.mixins.json"]
	def refmaps = [processResources: "horsingaround.refmap.json", processClientResources: "horsingaround.client.refmap.json"]
	mixin {
		add sourceSets.main, refmaps.processResources
		add sourceSets.client, refmaps.processClientResources
		mixinConfigs.each { config it }
	}
	refmaps.each { taskName, refmap ->
		tasks.named(taskName) {
			inputs.property "refmap", refmap
			inputs.property "mixinMinVersion", "0.8"
			filesMatching("*.mixins.json") {
				// (And the oldest Mixin they need: Forge's logs an error for a config that doesn't say.)
				filter { line -> line.contains('"package"') ? "\t\"refmap\": \"${refmap}\",\n\t\"minVersion\": \"0.8\",\n${line}" : line }
			}
		}
	}
	jar.manifest.attributes(["MixinConfigs": mixinConfigs.join(",")])
	// A name the annotation processor can't map is only a warning, and a mixin that misses in every player's game: an error here.
	tasks.withType(JavaCompile).configureEach { options.compilerArgs.add("-Werror") }
	// (The add-on puts the main source set's refmap in the jar, not the client one's, which the annotation processor writes here.)
	jar.from(layout.buildDirectory.file("mixin/${refmaps.processClientResources}"))
	// Every mixin config must name a refmap in the jar, or the game crashes on launch (as the Fabric jars are checked).
	def releaseJar = tasks.named("reobfJar").flatMap { it.archiveFile }
	def checkRefmaps = tasks.register("checkRefmaps") {
		inputs.file(releaseJar)
		doLast {
			new java.util.zip.ZipFile(releaseJar.get().asFile).withCloseable { zip ->
				def listed = zip.getInputStream(zip.getEntry("META-INF/MANIFEST.MF")).withCloseable { new java.util.jar.Manifest(it).mainAttributes.getValue("MixinConfigs") }
				if (listed?.split(",")?.toList() != mixinConfigs) throw new GradleException("${zip.name} lists the mixin configs ${listed}, not ${mixinConfigs}")
				mixinConfigs.each { config ->
					def refmap = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry(config))).refmap
					if (!refmap || zip.getEntry(refmap) == null) {
						throw new GradleException("${config} in ${zip.name} names no refmap in the jar (it says: ${refmap}), so it would crash on launch")
					}
				}
			}
		}
	}
	tasks.named("reobfJar") { finalizedBy checkRefmaps }

	// Forge reads a mod's resources as a pack, which needs its pack.mcmeta (15: 1.20.1's format).
	def packMeta = layout.buildDirectory.dir("generated/packMeta")
	def writePackMeta = tasks.register("writePackMeta") {
		outputs.dir(packMeta)
		doLast {
			packMeta.get().file("pack.mcmeta").asFile.text = '{"pack": {"description": "Horsing Around", "pack_format": 15}}\n'
		}
	}
	tasks.named("processResources") {
		from(writePackMeta)
		// Data pack folders had plural names before 1.21 (tags/entity_types).
		includeEmptyDirs = false
		eachFile { details ->
			details.path = details.path.replace('/tags/entity_type/', '/tags/entity_types/').replace('/tags/block/', '/tags/blocks/')
		}
	}
}

ext.freshAnimationsTargets = [
	repoDir.dir("${runFolder}/resourcepacks").asFile,
	rootProject.layout.buildDirectory.dir("run/smoke/${project.name}/resourcepacks").get().asFile
]
// The client tests run on every NeoForge version too (gradle/client-tests-neoforge.gradle); not yet on Forge (issue 127).
if (!forge) {
	ext.freshAnimationsTargets << rootProject.layout.buildDirectory.dir("run/clientGameTest-${project.name}/resourcepacks").get().asFile
}
apply from: repoDir.file('gradle/fresh-animations.gradle')
tasks.named("runClient") { dependsOn "installFreshAnimations" }

// The in-game smoke test, as on Fabric: ./gradlew :<node>:runSmoke.
apply from: repoDir.file('gradle/smoke-test.gradle')
apply from: repoDir.file('gradle/x11-games.gradle')
if (!forge) {
	apply from: repoDir.file('gradle/client-tests-neoforge.gradle')
}
// Plain "runClient" starts only the main version's (Fabric) game: these answer by path (./gradlew :26.3-neoforge:runClient).
tasks.matching { it.name in ["runClient", "runServer"] }.configureEach { task ->
	def plainEverywhere = gradle.startParameter.taskNames.contains(task.name) && (gradle.startParameter.projectDir ?: gradle.startParameter.currentDir) != projectDir
	task.onlyIf("plain ${task.name} starts only the main version's game; use :${project.name}:${task.name}") { !plainEverywhere }
}

// ./gradlew :<node>:auditMixins (plain auditMixins runs every version's): every class the mixins patch loaded in a
// NeoForge (Forge) client and dedicated server (MixinAudit), which then quit; fails unless both say so and nothing in the log
// names a mixin failure. One NeoForge or Forge game at a time.
abstract class NeoForgeAuditGame implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}
def auditGame = gradle.sharedServices.registerIfAbsent("neoforgeAuditGame", NeoForgeAuditGame) { maxParallelUsages = 1 }
["Client", "Server"].each { side ->
	def auditDir = rootProject.layout.buildDirectory.dir("run/audit/${project.name}/${side.toLowerCase()}").get().asFile
	tasks.named("runAudit${side}") {
		group = "verification"
		usesService(auditGame)
		doFirst {
			new File(auditDir, "logs").deleteDir()
			auditDir.mkdirs()
			new File(auditDir, "eula.txt").text = "eula=true\n"
			if (side == "Client") {
				new File(auditDir, "options.txt").text = "soundCategory_master:0.0\n" // Silent, like every test game.
			}
			// Any free port: a Fabric audit server (its own one-at-a-time limit) or anything else may hold the default.
			if (side == "Server") {
				new File(auditDir, "server.properties").text = "server-port=0\n"
			}
		}
		doLast {
			def log = new File(auditDir, "logs/latest.log")
			def text = log.exists() ? log.text : ""
			def problems = text.readLines().findAll { it =~ /Mixin apply for mod|Mixin apply failed|Injection validation failed|could not find any targets|InvalidInjectionException|InvalidMixinException|MixinApplyError|MixinTransformerError|Critical injection failure/ }
			if (!text.contains("Horsing Around mixin audit passed") || !problems.isEmpty()) {
				throw new GradleException("Mixin audit failed on ${mc} ${loaderName} (${side.toLowerCase()}); see ${log}\n" + problems.take(20).join("\n"))
			}
			logger.lifecycle("Mixin audit passed on ${mc} ${loaderName} (${side.toLowerCase()}).")
		}
	}
}
tasks.register("auditMixins") {
	group = "verification"
	dependsOn "runAuditClient", "runAuditServer"
}
tasks.named("runAuditServer") { mustRunAfter "runAuditClient" }

// The mods.toml and the mixin configs carry this node's Minecraft range and Java version.
// (The cowboy hat is done with the render state from 1.21.2; before, two mixins keep a helmet off the supporter's head.)
def hatMixins = sc.current.parsed.matches('>=1.21.2') ? '"AvatarRenderStateMixin", "AvatarRendererMixin",' : '"CustomHeadLayerMixin", "HumanoidArmorLayerMixin",'
// (NeoForge for 26.2 renamed the mod list's logoFile to iconFile, and warns at start-up about the old name.)
def logo = sc.current.parsed.matches('>=26.2') ? 'iconFile' : 'logoFile'
def resourceProps = [version: project.version.toString(), minecraft: project.minecraft_range, (loader): forge ? project.forge_version : project.neoforge_minimum, mixinJava: javaVersion.toString(), hatMixins: hatMixins, logo: logo]
tasks.matching { it.name in ["processResources", "processClientResources"] }.configureEach {
	inputs.properties resourceProps
	filesMatching(["META-INF/neoforge.mods.toml", "META-INF/mods.toml", "*.mixins.json"]) {
		expand resourceProps
	}
}

jar {
	from sourceSets.client.output
	from(repoDir.files("COPYING", "COPYING.LESSER")) {
		rename { "${it}_horsingaround" }
	}
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

// Release to Modrinth and CurseForge, with the Fabric jars (gradle/publish.gradle).
apply from: repoDir.file('gradle/publish.gradle')
