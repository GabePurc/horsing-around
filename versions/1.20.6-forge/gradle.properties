# Minecraft 1.20.6 on Forge (build.forge.gradle, with ForgeGradle).
minecraft_version=1.20.6
minecraft_range=[1.20.6,1.21)
# The game versions this jar is listed for on Modrinth (the same as minecraft_range)
game_versions=1.20.6
# Oldest Forge the jar asks for (mods.toml), and what it builds and audits with (50.1 can't start in ForgeGradle's games)
forge_version=50.2.0
# The pack format in the jar's pack.mcmeta (Forge's own for this version; without a pack.mcmeta Forge loads none of the mod's assets or tags)
pack_format=41
emf_version=3.0.17-forge-1.20.6
etf_version=7.0.13-forge-1.20.6
shoulder_surfing_version=1.20.6-4.2.1
