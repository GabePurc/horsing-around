def compatTests = project.findProperty("compatTests")
// (The horses pack skips the server test: Horseman's server config isn't loaded in the test's second, in-process server.)
// (Icy's pack rides one of its breeds through the horse tests, an American Paint: a vanilla horse's size, summoned with
// the tests' own stats, and none of its abilities changes how it rides. MountsTest checks the breeds' traits.)
def compatPackTests = [horses: "ride,mounts", icys: "ride,terrain,mounts,server,icy", realcamera: "realcamera,mounts,server,ride"]
def compatPackHorse = [icys: "icys-better-horses:american_paint_horse"]
def compatPlayScene = [icys: "cart"]
// (Most packs run the ride test's core and cuts sections; Icy's runs every section, its breed standing in for the horse.)
def compatPackSections = [icys: "", performance: "core,cuts,unseen"]
def compatSections = project.findProperty("compatSections")

configurations.register("compatBase") { transitive = false }
compatPacks.each { name, mods ->
	configurations.register("compat${name.capitalize()}") { transitive = false }
}
dependencies {
	compatBaseMods.each { add("compatBase", "maven.modrinth:$it") }
	compatPacks.each { name, mods ->
		mods.each { add("compat${name.capitalize()}", "maven.modrinth:$it") }
	}
}

// The client tests as a mod of their own (Minecraft 26 is unobfuscated, so no remapping).
// (Outside build/libs, which holds only the jar players install.)
def gametestJar = tasks.register("gametestJar", Jar) {
	from sourceSets.gametest.output
	archiveClassifier = "gametest"
	destinationDirectory = rootProject.layout.buildDirectory.dir("compat-libs")
}

// The play scene as a mod of its own: never the tests' jar, whose mixins are for tests (they stop the game grabbing the mouse...).
def playSceneJar = tasks.register("playSceneJar", Jar) {
	from(sourceSets.gametest.output) { include "dev/horsingaround/gametest/PlayScene*.class" }
	from(rootProject.file("src/gametest/playscene"))
	archiveClassifier = "playscene"
	destinationDirectory = rootProject.layout.buildDirectory.dir("compat-libs")
}

def freshAnimationsPack = project.ext.freshAnimationsZip
// (A script plugin can't see Loom's classes by name; take the task type from Loom's own class loader.)
def clientProductionRunTask = loom.getClass().classLoader.loadClass("net.fabricmc.loom.task.prod.ClientProductionRunTask")
// One game at a time: each run opens a window and its server test takes the default server port.
abstract class CompatGame implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}
def compatGame = gradle.sharedServices.registerIfAbsent("compatGame", CompatGame) { maxParallelUsages = 1 }
def runCompat = tasks.register("runCompat") {
	group = "verification"
	description = "Runs the client tests in a production game with each pack of popular mods."
}
compatPacks.keySet().each { name ->
	def runDir = rootProject.layout.buildDirectory.dir("run/compat/$name").get().asFile
	def task = tasks.register("runCompat${name.capitalize()}", clientProductionRunTask) {
		group = "verification"
		description = "Runs the client tests in a production game with the $name pack."
		dependsOn "installFreshAnimations"
		usesService(compatGame)
		outputs.upToDateWhen { false } // Loom counts an unchanged run as up to date and would skip it.
		finalizedBy "compatFindings${name.capitalize()}"
		mods.from(tasks.named("jar"))
		mods.from(gametestJar)
		mods.from(configurations.named("compatBase"))
		mods.from(configurations.named("compat${name.capitalize()}"))
		jvmArgs.add("-Dhorsingaround.gametest")
		jvmArgs.add("-Dhorsingaround.tests=" + (compatTests ?: compatPackTests[name] ?: "mounts,server,ride"))
		jvmArgs.add("-Dhorsingaround.sections=" + (compatSections ?: compatPackSections.getOrDefault(name, "core,cuts")))
		if (compatPackHorse[name]) {
			jvmArgs.add("-Dhorsingaround.horse=" + compatPackHorse[name])
		}
		jvmArgs.add("-Dhorsingaround.scenario=")
		jvmArgs.add("-Dhorsingaround.frameClock=" + !project.hasProperty("realTime"))
		// (X11 on Linux, from a Wayland session's shell too: with RenderSystemMixin in the tests, as these can't be given an environment.)
		if (System.getProperty("os.name").startsWith("Linux") && System.getenv("DISPLAY") != null) {
			jvmArgs.add("-Dorg.lwjgl.opengl.contextAPI=native")
		}
		getRunDir().set(runDir)
		doFirst {
			new File(runDir, "logs").deleteDir()
			new File(runDir, "screenshots").deleteDir()
			new File(runDir, "resourcepacks").mkdirs()
			java.nio.file.Files.copy(freshAnimationsPack.toPath(), new File(runDir, "resourcepacks/" + freshAnimationsPack.name).toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			// The server test starts a local dedicated server; the user accepted the Minecraft EULA for it (2026-10-07).
			new File(runDir, "eula.txt").text = "eula=true\n"
		}
	}
	// Runs after the game even when the tests failed, so the log is always checked.
	tasks.register("compatFindings${name.capitalize()}") {
		doLast {
			def log = new File(runDir, "logs/latest.log")
			def lines = log.exists() ? log.readLines() : []
			def mixin = ~/(?i)(mixin apply failed|injection failure|critical injection|overwrite conflict|redirect conflict|conflict.*mixin|mixin.*conflict|InvalidInjectionException|InjectionError)/
			def ours = ~/horsingaround(?!-gametest)/
			def findings = lines.findAll { it =~ mixin || (it =~ ours && it =~ /(WARN|ERROR)\]/) || it =~ /\/(WARN|ERROR)\] \(FabricLoader\/Mixin\)/ }
			new File(runDir, "compat-findings.txt").text = findings.join("\n") + "\n"
			def blocking = lines.findAll { it =~ mixin || (it =~ ours && it =~ /(WARN|ERROR)\]/) }
			if (!blocking.isEmpty()) {
				throw new GradleException("Compatibility problems with the $name pack:\n" + blocking.take(40).join("\n"))
			}
		}
	}
	runCompat.configure { dependsOn task }
	// To play-test with a pack: ./gradlew playCompatIcys (no tests; worlds and settings stay between runs). A pack with a scene
	// boots straight into it; -Pscene=<name> picks another (PlayScene), -Pscene=none plays normally.
	def playDir = rootProject.layout.buildDirectory.dir("run/play/$name").get().asFile
	tasks.register("playCompat${name.capitalize()}", clientProductionRunTask) {
		group = "verification"
		description = "Plays a production game with the $name pack, without the tests."
		dependsOn "installFreshAnimations"
		usesService(compatGame)
		outputs.upToDateWhen { false } // (See runCompat.)
		mods.from(tasks.named("jar"))
		mods.from(configurations.named("compatBase"))
		mods.from(configurations.named("compat${name.capitalize()}"))
		getRunDir().set(playDir)
		programArgs.addAll("--username", "Rider")
		def scene = project.findProperty("scene") ?: compatPlayScene[name]
		def inScene = scene && scene != "none"
		if (inScene) {
			mods.from(playSceneJar)
			jvmArgs.add("-Dhorsingaround.play=$scene")
			if (project.findProperty("sceneCheck")) {
				jvmArgs.add("-Dhorsingaround.play.check=true")
			}
		}
		doFirst {
			if (inScene) {
				new File(playDir, "saves/Scene").deleteDir()
			}
			new File(playDir, "resourcepacks").mkdirs()
			java.nio.file.Files.copy(freshAnimationsPack.toPath(), new File(playDir, "resourcepacks/" + freshAnimationsPack.name).toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			def options = new File(playDir, "options.txt")
			if (!options.exists()) options.text = 'resourcePacks:["vanilla","file/' + freshAnimationsPack.name + '"]\n'
		}
	}
}
