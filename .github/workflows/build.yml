# Builds the mod on a clean Linux machine for every push to main and every pull request; the jars (one per Minecraft
# version) are attached to the run. On a pull request it also does the release's dry run (nothing is uploaded, no secrets
# needed), so release notes that don't match the version fail before the release does.
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: Release dry run (the changelog's top entry is this version's)
        if: github.event_name == 'pull_request'
        run: ./gradlew publishModrinth -PpublishDryRun
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/*.jar
