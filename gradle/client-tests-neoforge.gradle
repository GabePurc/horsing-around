// The client tests on NeoForge and Forge 1.20.1: the same tests on the same harness (src/gametest) as on Fabric, in
// ModDevGradle's runs. ./gradlew :<node>:runClientGameTest, or :<node>:runClientGameTestParallel --continue for the
// shards; reports and screenshots in build/run/clientGameTest-<node>/. The flags are Fabric's (client-tests-common.gradle).
// Applied by build.neoforge.gradle. Forge 1.20.1's games draw the plain horse model (no Entity Model Features in its
// dev games), on vanilla's horse (build.neoforge.gradle leaves Realistic Horse Genetics out of them).
def forge = project.name.endsWith('-forge')

// (A local: the runs below and the common script need the same folder name.)
def testFolder = "clientGameTest-${project.name}"
ext.clientTestRuns = testFolder

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
	}
	// (Fabric's: its metadata, the bare-server test on Fabric's game test API, and the compat games' play scene.)
	gametest.java.exclude 'dev/horsingaround/gametest/DedicatedServerTest.java', 'dev/horsingaround/gametest/PlayScene.java'
	if (forge) {
		gametest.resources.exclude 'fabric.mod.json', 'META-INF/neoforge.mods.toml', 'horsingaround-gametest-neoforge.mixins.json'
		gametest.java.exclude 'dev/horsingaround/gametest/neoforge/**'
	} else {
		gametest.resources.exclude 'fabric.mod.json', 'META-INF/mods.toml', 'horsingaround-gametest-forge.mixins.json'
		gametest.java.exclude 'dev/horsingaround/gametest/forge/**'
	}
	// (26.3's alone until their compat packs move, issue 127: as on Fabric, client-tests.gradle.)
	if (!sc.current.parsed.matches('>=26.3')) {
		gametest.java.exclude(['StoreMediaTest', 'GalleryTest', 'ClipCursor', 'IcyFeaturesTest', 'RealCameraTest'].collect { "dev/horsingaround/gametest/${it}.java".toString() })
	}
}
// The mixin configs carry this node's Java version.
def testMixinJava = project.ext.javaVersion.toString()
tasks.named("processGametestResources") {
	inputs.property "mixinJava", testMixinJava
	filesMatching("*.mixins.json") {
		expand mixinJava: testMixinJava
	}
}

// Light test games on 26.3 load these performance mods, as on Fabric (NeoForge builds of the same versions), unless
// -PplainGame; the other versions run without for now.
if (sc.current.parsed.matches('>=26.3') && !project.hasProperty("plainGame")) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:zqgcaQxE"          // mc26.3-0.9.3-beta.4-neoforge (0.9.2 fails on this NeoForge)
		gametestRuntimeOnly "maven.modrinth:lithium:1rb9wI5K"         // mc26.3-0.26.2-neoforge
		gametestRuntimeOnly "maven.modrinth:ferrite-core:LtVvw4uS"    // 9.0.0-neoforge
		gametestRuntimeOnly "maven.modrinth:immediatelyfast:4SovUFpn" // 1.17.1+26.3-neoforge
	}
}

// NeoForge from 26.2 holds the title screen back behind a screen of load warnings (some mods' metadata draws them; the
// smoke test does the same); the tests start from the title screen.
ext.prepareClientTestDir = { File dir ->
	def clientConfig = new File(dir, "config/neoforge-client.toml")
	clientConfig.parentFile.mkdirs()
	clientConfig.text = "showLoadWarnings = false\n"
}
apply from: rootProject.layout.projectDirectory.file('gradle/client-tests-common.gradle')

// (Forge for 1.20.1 has no list of mixin configs in mods.toml: the games are told the tests' on the command line.)
def testMixinConfigs = ["horsingaround-gametest.mixins.json", "horsingaround-gametest-harness.mixins.json", "horsingaround-gametest-forge.mixins.json"]
configure(forge ? legacyForge : neoForge) {
	addModdingDependenciesTo sourceSets.gametest
	mods {
		"horsingaround_gametest" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		def testRun = { run, String folder ->
			run.client()
			run.sourceSet = sourceSets.gametest
			run.loadedMods = [mods.horsingaround, mods.horsingaround_gametest]
			run.gameDirectory = rootProject.layout.buildDirectory.dir("run/${folder}")
			run.systemProperty 'horsingaround.gametest', 'true'
			if (forge) {
				testMixinConfigs.each { run.programArguments.addAll('--mixin.config', it) }
			}
		}
		clientGameTest { testRun(it, testFolder) }
		project.ext.testShards.each { name, shard ->
			register("clientGameTest${name}") { testRun(it, "${testFolder}-${name.toLowerCase()}") }
		}
	}
}
