// The client tests on Fabric, every version: ./gradlew :<version>:runClientGameTest, reports and screenshots in
// build/run/clientGameTest/ (26.3) or build/run/clientGameTest-<version>/. On 26.3, ./gradlew runGameTest also starts a
// bare dedicated server (no client code) and rides a horse on it. What both loaders share (runs, shards, reports) is
// client-tests-common.gradle.
def mc = sc.current.version
def mainVersion = mc == '26.3'
def testFolder = mainVersion ? "clientGameTest" : "clientGameTest-${mc}"
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "horsingaround-gametest"
		enableGameTests = mainVersion
		enableClientGameTests = false
	}
}
// (The tests' NeoForge entry and metadata are NeoForge's: gradle/client-tests-neoforge.gradle.)
sourceSets.gametest.java.exclude 'dev/horsingaround/gametest/neoforge/**'
sourceSets.gametest.resources.exclude 'META-INF/neoforge.mods.toml', 'horsingaround-gametest-neoforge.mixins.json'
if (!mainVersion) {
	// 26.3's alone until their compat packs move (issue 127): the bare-server test (Fabric's game test API), the store
	// and gallery shots, Icy's and Real Camera's tests, and the compat games' play scene.
	sourceSets.gametest.java.exclude(['DedicatedServerTest', 'StoreMediaTest', 'GalleryTest', 'ClipCursor', 'IcyFeaturesTest', 'RealCameraTest', 'PlayScene']
		.collect { "dev/horsingaround/gametest/${it}.java".toString() })
}
dependencies {
	// (Remapped before 26, where the game is obfuscated.)
	add(sc.current.parsed.matches('>=26') ? "gametestCompileOnly" : "modGametestCompileOnly", "maven.modrinth:modmenu:${project.modmenu_version}")
	if (sc.current.parsed.matches('>=26.3')) {
		gametestCompileOnly "org.lwjgl:lwjgl-sdl:3.4.3" // (The game brings it at run time.)
	}
}
// The test metadata and mixin configs carry this node's Java version, and the bare-server test only where it runs.
def testResourceProps = [mixinJava: (javaVersion == 21 ? 17 : javaVersion).toString(), serverTests: mainVersion ? '"dev.horsingaround.gametest.DedicatedServerTest"' : '']
tasks.named("processGametestResources") {
	inputs.properties testResourceProps
	filesMatching(["fabric.mod.json", "*.mixins.json"]) {
		expand testResourceProps
	}
}
// Client tests run on this project's own harness (src/gametest/.../harness, ported from Fabric API's), the same on every
// loader, not on Fabric API's.
loom.runs.register("clientGameTest") {
	client()
	source sourceSets.gametest
	property "horsingaround.gametest"
	ideConfigGenerated false
}
// Test games run in the repo's build/run/ (this node's own folder is versions/<version>/).
loom.runs.matching { it.name == "clientGameTest" }.configureEach { run -> run.runDir "../../build/run/${testFolder}" }
loom.runs.matching { it.name == "gameTest" }.configureEach { run -> run.runDir "../../build/run/gameTest" }

ext.clientTestRuns = testFolder
apply from: rootProject.layout.projectDirectory.file('gradle/client-tests-common.gradle')
loom {
	runs {
		project.ext.testShards.each { name, shard ->
			register("clientGameTest${name}") {
				inherit clientGameTest
				runDir "../../build/run/${testFolder}-${name.toLowerCase()}"
				ideConfigGenerated false
			}
		}
	}
}
// Light test games load performance mods on 26.3 (-PplainGame without); the other versions run without for now.
if (mainVersion) {
	def clientTests = project.findProperty("tests") ?: "ride,terrain,mounts,server,hat,settings"
	configurations.register("testPerformanceMods") { transitive = false }
	dependencies {
		testPerformanceMods "maven.modrinth:sodium:bAZQdGpg"          // mc26.3-0.9.2
		testPerformanceMods "maven.modrinth:lithium:xS0Q8LSi"         // mc26.3-0.26.2
		testPerformanceMods "maven.modrinth:ferrite-core:d5ddUdiB"    // 9.0.0
		testPerformanceMods "maven.modrinth:immediatelyfast:3MP9UR23" // 1.17.1+26.3
	}
	// (Not with -PshaderPack, compat.gradle: that loads its own Sodium.)
	def performanceMods = project.hasProperty("plainGame") || project.hasProperty("shaderPack") ? null : configurations.testPerformanceMods
	// Store filming also loads ATMOSPHERICS, for its skies, clouds and haze (user request, 2026-10-19). Not with a shader
	// pack, which draws its own sky.
	configurations.register("storeLookMods") { transitive = false }
	dependencies {
		storeLookMods "maven.modrinth:atmospherics:DbHCSFGO" // 2.6.7 for 26.3
	}
	def storeLook = clientTests.contains("store") && !project.hasProperty("shaderPack") ? configurations.storeLookMods : null
	tasks.matching { it.name ==~ /runClientGameTest(RideA|RideB|RideC|Terrain|Others)?/ }.configureEach { task ->
		def addMods = [performanceMods, storeLook].findAll { it != null }.collect { it.asPath }
		if (!addMods.isEmpty()) {
			task.systemProperty "fabric.addMods", addMods.join(File.pathSeparator)
		}
	}
}
