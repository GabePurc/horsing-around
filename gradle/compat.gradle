// Fabric 26.3 only (applied by build.gradle there): shader packs on the client test runs, and the compatibility runs.
// Pinned by Modrinth version id, not version number: some mods reuse a number across Minecraft versions.

// Shaders on any client test run (store stills, or legs with a pack's shadow pass): -PshaderPack=<path to a shader
// pack zip> also loads Sodium and Iris (the compatibility pack's versions) and turns that pack on, with its settings
// file (<pack>.txt) when there is one. Dev-only; nothing here ships.
def storeShaderPack = project.findProperty("shaderPack")
if (storeShaderPack) {
	dependencies {
		modLocalRuntime "maven.modrinth:sodium:v4PSXean"
		modLocalRuntime "maven.modrinth:iris:vTN4NRGW"
	}
	def pack = file(storeShaderPack)
	def packSettings = new File(pack.path + ".txt")
	def shaderPacks = rootProject.layout.buildDirectory.dir("run/clientGameTest/shaderpacks").get().asFile
	def irisConfig = rootProject.layout.buildDirectory.file("run/clientGameTest/config/iris.properties").get().asFile
	tasks.matching { it.name == "runClientGameTest" }.configureEach {
		doFirst {
			shaderPacks.mkdirs()
			java.nio.file.Files.copy(pack.toPath(), new File(shaderPacks, pack.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			if (packSettings.exists()) {
				java.nio.file.Files.copy(packSettings.toPath(), new File(shaderPacks, packSettings.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}
			irisConfig.parentFile.mkdirs()
			irisConfig.text = "enableShaders=true\nshaderPack=${pack.name}\ndisableUpdateMessage=true\n"
		}
	}
}

// Compatibility runs: the built mod in a real (production) game alongside packs of popular mods from Modrinth, running
// the client tests (mounts, the dedicated-server ride and the core ride sections). Each pack runs on its own:
//   ./gradlew runCompatPerformance (or Animation, Camera, Horses), or ./gradlew runCompat --continue for all of them.
// Reports, screenshots and the game log land in build/run/compat/<pack>/. A run fails on failed checks, a crash, a
// mixin conflict, or a warning or error that names this mod; compat-findings.txt lists every mixin and mod warning
// for review.

// Always present: what the test setup needs (Fabric API, Mod Menu) and the user's Fresh Animations stack. Modrinth
// version ids, not version numbers: some mods reuse a number across Minecraft versions.
